[package]
name = "client_macroquad"
version = "0.4.1"
edition = "2021"
description = "Macroquad 0.4.x interactive rendering client for HEAV3NS-ENGINE (WONDERLAND)"
license = "Proprietary"

[dependencies]
heav3ns-engine = { path = ".." }
macroquad = { version = "0.4", features = ["audio"] }
keyframe = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
image = { version = "0.24", default-features = false, features = ["webp", "png"] }

